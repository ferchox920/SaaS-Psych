name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  test-build:
    name: Test + Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Unit and package tests
        run: go test ./...

      - name: Build server
        run: go build ./cmd/server

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          working-directory: apps/api
          args: --config .golangci.yml --timeout=3m

  integration-db:
    name: Integration (Postgres + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sessionflow
          POSTGRES_PASSWORD: sessionflow
          POSTGRES_DB: sessionflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sessionflow -d sessionflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://sessionflow:sessionflow@127.0.0.1:5432/sessionflow?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379
      RUN_PG_INTEGRATION: "1"
    defaults:
      run:
        working-directory: apps/api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: apps/api/go.sum

      - name: Install migrate CLI
        run: |
          curl -sSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz -o /tmp/migrate.tar.gz
          tar -xzf /tmp/migrate.tar.gz -C /tmp
          sudo mv /tmp/migrate /usr/local/bin/migrate
          migrate -version

      - name: Apply migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Run integration tests
        run: go test -count=1 ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Check local Compose ports
        run: node tools/check-compose-ports.mjs

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter web lint

      - name: TypeScript
        run: pnpm --filter web typecheck

      - name: Production build
        run: pnpm --filter web build

      - name: Install Playwright Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Functional browser tests
        run: pnpm --filter web test

  transcription-python:
    name: Transcription Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/transcription/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --requirement tools/transcription/requirements.txt

      - name: Test transcriber contracts without a model download
        run: python -m unittest discover -s tools/transcription -p 'test_*.py' -v
