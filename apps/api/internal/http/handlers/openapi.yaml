components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID

  parameters:
    PathClientID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathClinicalClientID:
      name: client_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathAppointmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathAppointmentIDAlt:
      name: appointment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathNoteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    QueryTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    ListLimit:
      name: limit
      in: query
      description: Maximo de elementos visibles por pagina (50 por defecto).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    ListOffset:
      name: offset
      in: query
      description: Desplazamiento sobre elementos visibles; reiniciar al cambiar filtros o permisos.
      schema:
        type: integer
        minimum: 0
        maximum: 1000000
        default: 0
    AuditActor:
      name: actor
      in: query
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      schema:
        type: string
