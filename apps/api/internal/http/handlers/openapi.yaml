  /api/v1/clients/{id}/project-exports:
    get:
      summary: List local export receipts, without clinical narratives (CA-R)
      security: [{bearerAuth: [], tenantHeader: []}]
      tags: [Clinical Longitudinal]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0, maximum: 1000000, default: 0}}
      responses:
        "200":
          description: Receipt metadata only; artifact retrieval separately enforces external consent
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicalProjectExportPage'}
        "400": {description: Invalid offset}
        "401": {description: Authentication required}
        "403": {description: Clinical access required}
    post:
      summary: Generate a local preview for manual GPT Project transfer (CA-W treating)
      description: No upload or inference occurs. Selected approved process only; minimized JSON and Markdown are returned. Copy export_id and content_hash alongside the artifact. No API key is required.
      tags: [Clinical Longitudinal]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [process_id]
              properties:
                process_id: {type: string, format: uuid}
      responses:
        "201":
          description: Generated locally; inspect before manual external transfer
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClinicalProjectExport'}
        "400": {description: Invalid request}
        "401": {description: Authentication required}
        "403": {description: Treating access required}
        "404": {description: Approved selected process not found in this patient}
        "409": {description: Patient state changed while preparing export}
