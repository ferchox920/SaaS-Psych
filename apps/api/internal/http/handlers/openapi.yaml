          minLength: 20
          maxLength: 40000

    ClinicalContextItem:
      type: object
      required: [source_id, kind, summary]
      properties:
        source_id:
          type: string
        kind:
          type: string
          enum: [fact, inference, hypothesis]
        summary:
          type: string

    ClinicalNowAction:
      type: string
      enum: [listen, clarify, reflect, explore, confront, restructure, resignify, values, regulate, no_intervention]

    ClinicalAnalysisResult:
      type: object
      description: JSON validado que solo se emite en el evento SSE result.
      required: [mode, node, hypothesis, evidence, now, caution, suggested_interventions, therapist_meta, risk]
      properties:
        mode:
          type: string
          enum: [live]
        node:
          type: string
        hypothesis:
          type: object
          required: [text, epistemic_level, traffic_light]
          properties:
            text:
              type: string
            epistemic_level:
              type: string
              enum: [fact, inference, hypothesis]
            traffic_light:
              type: string
              enum: [green, yellow, red]
        evidence:
          type: array
          maxItems: 4
          items:
            type: object
            required: [source_id, kind, summary]
            properties:
              source_id:
                type: string
              kind:
                type: string
                enum: [fact, inference]
              summary:
                type: string
        now:
          $ref: "#/components/schemas/ClinicalNowAction"
        caution:
          type: string
        suggested_interventions:
          type: array
          maxItems: 2
          items:
            type: string
        therapist_meta:
          type: string
          nullable: true
        risk:
          type: object
          required: [detected, category, requires_human_assessment]
          properties:
            detected:
              type: boolean
            category:
              type: string
              nullable: true
            requires_human_assessment:
              type: boolean

    ClinicalReviewResult:
      type: object
      required: [mode, emerging_formulation, effective_interventions, weak_or_risky_interventions, hypothesis_calibration, patient_responses, alliance, therapist_patterns, next_focus, evidence, caution, risk]
      properties:
        mode: { type: string, enum: [review] }
        emerging_formulation: { type: string }
        effective_interventions:
          type: array
          maxItems: 6
          items: { type: string }
        weak_or_risky_interventions:
          type: array
          maxItems: 6
          items: { type: string }
        hypothesis_calibration: { type: string }
        patient_responses: { type: string }
        alliance: { type: string }
        therapist_patterns:
          type: array
          maxItems: 6
          items: { type: string }
        next_focus:
          type: array
          maxItems: 6
          items: { type: string }
        evidence:
          type: array
          maxItems: 8
          items:
            type: object
            required: [source_id, kind, summary]
            properties:
              source_id: { type: string }
              kind: { type: string, enum: [fact, inference] }
              summary: { type: string }
        caution: { type: string }
        risk:
          type: object
          required: [detected, category, requires_human_assessment]
          properties:
            detected: { type: boolean }
            category: { type: string, nullable: true }
            requires_human_assessment: { type: boolean }

