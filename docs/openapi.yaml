openapi: 3.0.3
info:
  title: SessionFlow API
  version: "1.0.0"
  description: |
    API multi-tenant de SessionFlow.
    Esta especificacion refleja los endpoints actuales implementados en `apps/api/internal/http/server.go`.
    En appointments, `cancel` reemplaza `delete` para preservar historial clinico.
servers:
  - url: http://localhost:8080
tags:
  - name: Health
  - name: Auth
  - name: Clients
  - name: Appointments
  - name: Session Notes
  - name: Clinical AI
  - name: Clinical Sessions
  - name: Session Reports
  - name: Longitudinal Clinical Core
  - name: Integrations
  - name: Audit

paths:
  /health:
    get:
      tags: [Health]
      summary: Healthcheck
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      responses:
        "200":
          description: Exposicion de metricas en formato Prometheus
          content:
            text/plain:
              schema:
                type: string

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login por email/password
      security:
        - tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: owner@tenant-a.local
              password: ChangeMe123!
      responses:
        "200":
          description: Login exitoso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "429":
          $ref: "#/components/responses/TooManyRequestsError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotacion de refresh token
      security:
        - tenantHeader: []
      description: Lee y rota exclusivamente la cookie HttpOnly `sessionflow_refresh`.
      responses:
        "200":
          description: Token rotado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoca refresh token
      security:
        - tenantHeader: []
      description: Revoca y expira la cookie HttpOnly `sessionflow_refresh`.
      responses:
        "204":
          description: Logout exitoso
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Usuario autenticado actual
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Identidad y rol del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/auth/admin-check:
    get:
      tags: [Auth]
      summary: Verifica acceso owner/admin
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Usuario autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/clients:
    post:
      tags: [Clients]
      summary: Crear cliente
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClientRequest"
            example:
              fullname: Jane Doe
              contact: jane@example.com
              notes_public: Primera consulta
      responses:
        "201":
          description: Cliente creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    get:
      tags: [Clients]
      summary: Listar clientes activos con asignacion clinica
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Lista de clientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/clients/archived:
    get:
      tags: [Clients]
      summary: Listar clientes archivados con asignacion clinica
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Historia de clientes archivados autorizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/clients/{id}:
    parameters:
      - $ref: "#/components/parameters/PathClientID"
    get:
      tags: [Clients]
      summary: Obtener cliente por id
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Cliente encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Clients]
      summary: Actualizar cliente
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertClientRequest"
            example:
              fullname: Jane Doe Updated
              contact: jane.updated@example.com
              notes_public: Seguimiento
      responses:
        "200":
          description: Cliente actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      tags: [Clients]
      summary: Archivar cliente (compatibilidad)
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "204":
          description: Cliente archivado sin borrar historia
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/clients/{id}/archive:
    parameters:
      - $ref: "#/components/parameters/PathClientID"
    post:
      tags: [Clients]
      summary: Archivar cliente con motivo
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArchiveClientRequest"
      responses:
        "204":
          description: Cliente archivado; historia preservada
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/clients/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/PathClientID"
    post:
      tags: [Clients]
      summary: Restaurar cliente archivado
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "204":
          description: Cliente restaurado con sus identificadores y relaciones originales
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/clients/{client_id}/assignments:
    parameters:
      - name: client_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Clinical Access]
      summary: Consultar historia de asignaciones clinicas
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Historia de asignaciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalAssignmentListResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      tags: [Clinical Access]
      summary: Conceder asignacion clinica
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantClinicalAssignmentRequest"
      responses:
        "201":
          description: Asignacion concedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalAssignment"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/clients/{client_id}/assignments/{assignment_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: assignment_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Clinical Access]
      summary: Finalizar asignacion clinica con motivo
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EndClinicalAssignmentRequest"
      responses:
        "204":
          description: Asignacion finalizada; historia preservada
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/clients/{client_id}/access-exceptions:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      tags: [Clinical Access]
      summary: Consultar historia de accesos excepcionales
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Historia auditada de excepciones
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessExceptionListResponse"
    post:
      tags: [Clinical Access]
      summary: Conceder acceso excepcional de solo lectura por hasta 24 horas
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantAccessExceptionRequest"
      responses:
        "201":
          description: Excepcion temporal concedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessException"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/clients/{client_id}/access-exceptions/{exception_id}:
    parameters:
      - name: client_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: exception_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    delete:
      tags: [Clinical Access]
      summary: Revocar inmediatamente un acceso excepcional
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeAccessExceptionRequest"
      responses:
        "204":
          description: Excepcion revocada con motivo
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/appointments:
    post:
      tags: [Appointments]
      summary: Crear cita
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentRequest"
            example:
              client_id: "c9ab5e4e-df2a-44bf-9db1-6e22a31f22a3"
              starts_at: "2026-03-05T15:00:00Z"
              ends_at: "2026-03-05T16:00:00Z"
              location: "consultorio 1"
      responses:
        "201":
          description: Cita creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"
    get:
      tags: [Appointments]
      summary: Listar citas por rango
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: "#/components/parameters/QueryFrom"
        - $ref: "#/components/parameters/QueryTo"
      responses:
        "200":
          description: Lista de citas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppointmentListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/appointments/{id}:
    parameters:
      - $ref: "#/components/parameters/PathAppointmentID"
    put:
      tags: [Appointments]
      summary: Actualizar cita
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentRequest"
            example:
              starts_at: "2026-03-05T15:30:00Z"
              ends_at: "2026-03-05T16:30:00Z"
              location: "consultorio 2"
      responses:
        "200":
          description: Cita actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/appointments/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/PathAppointmentID"
    post:
      tags: [Appointments]
      summary: Cancelar cita
      description: |
        Formaliza el lifecycle state de appointments.
        No existe delete fisico; la cita transiciona de `scheduled` a `canceled`.
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Cita cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/appointments/{appointment_id}/notes:
    parameters:
      - $ref: "#/components/parameters/PathAppointmentIDAlt"
    post:
      tags: [Session Notes]
      summary: Crear nota de sesion
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionNoteRequest"
            example:
              body: Paciente estable, continuar tratamiento
              is_private: true
      responses:
        "201":
          description: Nota creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    get:
      tags: [Session Notes]
      summary: Listar notas por cita
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Lista de notas visibles para el usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNoteListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/notes/{id}:
    parameters:
      - $ref: "#/components/parameters/PathNoteID"
    get:
      tags: [Session Notes]
      summary: Obtener nota por id
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Nota encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    put:
      tags: [Session Notes]
      summary: Actualizar nota por id
      description: |
        Solo puede editar el autor con asignacion `treating` activa mientras la nota sea borrador.
        `appointment_id` y `author_user_id` son inmutables y no se aceptan en payload.
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionNoteRequest"
            example:
              body: Nota actualizada
              is_private: false
      responses:
        "200":
          description: Nota actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/notes/{id}/sign:
    parameters:
      - $ref: "#/components/parameters/PathNoteID"
    post:
      tags: [Session Notes]
      summary: Firmar y cerrar un borrador
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Nota firmada; ya no admite sobrescritura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/notes/{id}/addenda:
    parameters:
      - $ref: "#/components/parameters/PathNoteID"
    post:
      tags: [Session Notes]
      summary: Agregar adenda documentada a una nota firmada
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddendumRequest"
      responses:
        "200":
          description: Adenda incorporada como nueva version inmutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNote"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/notes/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/PathNoteID"
    get:
      tags: [Session Notes]
      summary: Consultar historia inmutable de la nota
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Versiones autorizadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionNoteVersionListResponse"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/clinical-ai/status:
    get:
      tags: [Clinical AI]
      summary: Estado del proveedor local y modelo configurado
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Ollama local disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalModelStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/clinical-ai/models:
    get:
      tags: [Clinical AI]
      summary: Modelos ya instalados en Ollama
      description: No descarga ni reemplaza modelos.
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Modelos locales instalados
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LocalModelInfo"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/clinical-ai/warm:
    post:
      tags: [Clinical AI]
      summary: Precarga el modelo local configurado
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Modelo cargado o mantenido en memoria
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/clinical-ai/unload:
    post:
      tags: [Clinical AI]
      summary: Descarga el modelo configurado de memoria
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Modelo descargado de memoria
        "409":
          $ref: "#/components/responses/ConflictError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/clinical-ai/analyze-live:
    post:
      tags: [Clinical AI]
      summary: Analiza un fragmento con el supervisor clínico local
      description: |
        Requiere asignación tratante activa sobre el paciente de la cita. La respuesta usa SSE.
        Los eventos `status` y `progress` no contienen material clínico; `result` se emite solo
        después de validar el JSON y aplicar guardas deterministas. Persiste solo la salida validada
        como sugerencia separada; el fragmento de entrada no se guarda en ese ledger.
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyzeLiveRequest"
      responses:
        "200":
          description: Flujo SSE con status, progress, result, done o error
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/clinical-ai/review-session:
    post:
      tags: [Clinical AI]
      summary: Revisa una sesion completa con prioridad inferior al modo en vivo
      description: El texto es transitorio; solo se guarda la salida validada como sugerencia separada. Una solicitud en vivo cancela la revision activa.
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSessionRequest"
      responses:
        "200":
          description: Flujo SSE con status, progress, result, done o error
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/appointments/{appointment_id}/ai-suggestions:
    parameters:
      - $ref: "#/components/parameters/PathAppointmentIDAlt"
    get:
      tags: [Clinical AI]
      summary: Lista sugerencias de IA separadas del registro clínico
      description: Requiere asignación tratante o supervisora activa y audita la lectura.
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Ledger de sugerencias de la cita
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClinicalSuggestion"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/clinical-ai/suggestions/{suggestion_id}/decision:
    parameters:
      - name: suggestion_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      tags: [Clinical AI]
      summary: Registra la decisión clínica sobre una sugerencia
      description: No promueve la sugerencia automáticamente a la formulación longitudinal.
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideClinicalSuggestionRequest"
      responses:
        "200":
          description: Decisión registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalSuggestion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/clients/{client_id}/formulations:
    parameters:
      - $ref: "#/components/parameters/PathClinicalClientID"
    get:
      tags: [Clinical AI]
      summary: Historial versionado de formulación longitudinal
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Formulaciones visibles por asignación clínica
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ClinicalFormulationSnapshot"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      tags: [Clinical AI]
      summary: Crea un borrador de formulación versionada
      description: Requiere asignación tratante. El borrador no alimenta al modelo hasta aprobarse.
      security:
        - bearerAuth: []
          tenantHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClinicalFormulationRequest"
      responses:
        "201":
          description: Borrador creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalFormulationSnapshot"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/clients/{client_id}/formulations/{snapshot_id}/approve:
    parameters:
      - $ref: "#/components/parameters/PathClinicalClientID"
      - name: snapshot_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Clinical AI]
      summary: Aprueba explícitamente una formulación
      description: Requiere asignación tratante y conserva como superseded la versión aprobada anterior.
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Formulación aprobada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicalFormulationSnapshot"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/clinical-transcription/status:
    get:
      tags: [Clinical AI]
      summary: Estado del transcriptor local efímero
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Estado y configuración no sensible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalTranscriptionStatus"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/appointments/{appointment_id}/transcription:
    parameters:
      - $ref: "#/components/parameters/PathAppointmentIDAlt"
    post:
      tags: [Clinical AI]
      summary: Transcribe un fragmento de audio en el sidecar local
      description: |
        Requiere asignación tratante, consentimiento explícito en header y audio efímero.
        El audio se elimina al finalizar o fallar y la transcripción no se persiste.
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: X-Clinical-Audio-Consent
          in: header
          required: true
          schema:
            type: boolean
            enum: [true]
      requestBody:
        required: true
        content:
          audio/webm:
            schema:
              type: string
              format: binary
          audio/ogg:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Texto local editable y métricas no sensibles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalTranscriptionResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "413":
          description: Audio sobre el límite efímero configurado
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/integrations/google-calendar/status:
    get:
      tags: [Integrations]
      summary: Estado de la conexión personal con Google Calendar
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: Estado no sensible de la integración
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoogleCalendarStatus"

  /api/v1/integrations/google-calendar/authorize:
    post:
      tags: [Integrations]
      summary: Inicia OAuth con state de un solo uso y PKCE
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "200":
          description: URL de autorización de Google
          content:
            application/json:
              schema:
                type: object
                required: [authorization_url]
                properties:
                  authorization_url:
                    type: string
                    format: uri
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"

  /api/v1/integrations/google-calendar/callback:
    get:
      tags: [Integrations]
      summary: Callback OAuth de Google
      parameters:
        - name: state
          in: query
          schema: { type: string }
        - name: code
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
      responses:
        "302":
          description: Redirección a la agenda con el resultado de la conexión

  /api/v1/integrations/google-calendar/events:
    get:
      tags: [Integrations]
      summary: Lista eventos temporizados aún no asociados
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Eventos candidatos del rango, sin persistirlos localmente
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoogleCalendarCandidate"

  /api/v1/integrations/google-calendar/events/{event_id}/import:
    post:
      tags: [Integrations]
      summary: Asocia un evento de Google a un paciente y crea el turno local
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - name: event_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id]
              properties:
                client_id: { type: string, format: uuid }
      responses:
        "201":
          description: Turno creado y vinculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/integrations/google-calendar/appointments/{appointment_id}/push:
    post:
      tags: [Integrations]
      summary: Crea o actualiza en Google el turno local seleccionado
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: "#/components/parameters/PathAppointmentIDAlt"
      responses:
        "200":
          description: Vínculo sincronizado

  /api/v1/integrations/google-calendar/connection:
    delete:
      tags: [Integrations]
      summary: Revoca y elimina el token de la conexión personal
      security:
        - bearerAuth: []
          tenantHeader: []
      responses:
        "204":
          description: Conexión revocada

  /api/v1/audit:
    get:
      tags: [Audit]
      summary: Listar audit logs del tenant
      security:
        - bearerAuth: []
          tenantHeader: []
      parameters:
        - $ref: "#/components/parameters/AuditActor"
        - $ref: "#/components/parameters/AuditAction"
        - $ref: "#/components/parameters/AuditActionPrefix"
        - $ref: "#/components/parameters/AuditEntity"
        - $ref: "#/components/parameters/AuditFrom"
        - $ref: "#/components/parameters/AuditTo"
        - $ref: "#/components/parameters/AuditCursor"
        - $ref: "#/components/parameters/AuditCursorID"
        - $ref: "#/components/parameters/AuditOrder"
        - $ref: "#/components/parameters/AuditLimit"
        - $ref: "#/components/parameters/AuditOffset"
      responses:
        "200":
          description: Lista paginada de auditoria
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/clinical-sessions:
    post:
      tags: [Clinical Sessions]
      summary: Crear un encuentro clínico real en progreso
      security: [{bearerAuth: [], tenantHeader: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_id, started_at]
              properties:
                client_id: {type: string, format: uuid}
                appointment_id: {type: string, format: uuid, nullable: true}
                started_at: {type: string, format: date-time}
      responses:
        "201": {description: Sesión clínica creada}
        "400": {$ref: "#/components/responses/ValidationError"}
        "401": {$ref: "#/components/responses/UnauthorizedError"}
        "403": {$ref: "#/components/responses/ForbiddenError"}
        "409": {description: Ya existe una sesión no anulada para la cita}

  /api/v1/clinical-sessions/{id}:
    get:
      tags: [Clinical Sessions]
      summary: Obtener sesión clínica
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Sesión clínica}
        "404": {description: No encontrada}

  /api/v1/clients/{client_id}/clinical-sessions:
    get:
      tags: [Clinical Sessions]
      summary: Listar sesiones clínicas visibles de un cliente
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: client_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Lista de sesiones clínicas}

  /api/v1/clinical-sessions/{id}/complete:
    post:
      tags: [Clinical Sessions]
      summary: Completar irreversiblemente una sesión en progreso
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Sesión completada}
        "409": {description: Transición inválida}

  /api/v1/clinical-sessions/{id}/void:
    post:
      tags: [Clinical Sessions]
      summary: Anular irreversiblemente una sesión en progreso
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Sesión anulada}
        "409": {description: Transición inválida}

  /api/v1/clinical-sessions/{id}/reports/generate:
    post:
      tags: [Session Reports]
      summary: Generar un draft session-report-v1.1 desde texto efímero
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_text]
              properties: {session_text: {type: string, minLength: 20, maxLength: 40000}}
      responses:
        "201": {description: ClinicalAIRun succeeded y report draft persistido}
        "422": {description: Salida IA incompatible con session-report-v1.1}

  /api/v1/clinical-sessions/{id}/reports:
    get:
      tags: [Session Reports]
      summary: Listar versiones de informes de una sesión
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Historial de reports}

  /api/v1/session-reports/{report_id}:
    get:
      tags: [Session Reports]
      summary: Obtener un informe
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: report_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Informe}
    put:
      tags: [Session Reports]
      summary: Editar con optimistic concurrency; un informe aprobado produce nueva versión draft
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: report_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Draft actualizado o nueva versión draft}
        "409": {description: Conflicto de revisión}

  /api/v1/session-reports/{report_id}/approve:
    post:
      tags: [Session Reports]
      summary: Aprobar explícitamente un report sin mutar memoria longitudinal
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: report_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "200": {description: Report aprobado; la versión aprobada previa queda superseded}
        "409": {description: Report no está en draft}

  /api/v1/clinical-sessions/{id}/longitudinal-analysis:
    post:
      tags: [Longitudinal Clinical Core]
      summary: Proponer un ClinicalDiff desde un SessionReport aprobado
      description: La IA solo crea una propuesta. No modifica el estado longitudinal antes del merge humano.
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        "201": {description: Nuevo diff pending_review, content: {application/json: {schema: {$ref: "#/components/schemas/LongitudinalAnalysisResponse"}}}}
        "200": {description: Diff abierto reutilizado, content: {application/json: {schema: {$ref: "#/components/schemas/LongitudinalAnalysisResponse"}}}}
        "409": {description: Estado o sesión incompatible}

  /api/v1/clients/{id}/longitudinal-state:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Reconstruir el estado longitudinal aprobado
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{$ref: "#/components/parameters/PathClientID"}]
      responses: {"200": {description: Estado normalizado, content: {application/json: {schema: {$ref: "#/components/schemas/ClientLongitudinalState"}}}}}

  /api/v1/clients/{id}/evidence:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Listar evidencia clínica y su lifecycle
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{$ref: "#/components/parameters/PathClientID"}]
      responses: {"200": {description: Evidencia longitudinal}}
  /api/v1/clients/{id}/events:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Listar eventos clínicos
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{$ref: "#/components/parameters/PathClientID"}]
      responses: {"200": {description: Eventos longitudinales}}
  /api/v1/clients/{id}/processes:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Listar procesos clínicos
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{$ref: "#/components/parameters/PathClientID"}]
      responses: {"200": {description: Procesos longitudinales}}
  /api/v1/clients/{id}/hypotheses:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Listar hipótesis y evidencia supporting/contradicting
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{$ref: "#/components/parameters/PathClientID"}]
      responses: {"200": {description: Hipótesis longitudinales}}
  /api/v1/clients/{id}/clinical-diffs:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Listar propuestas longitudinales
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{$ref: "#/components/parameters/PathClientID"}]
      responses: {"200": {description: ClinicalDiff history}}

  /api/v1/clinical-diffs/{id}:
    get:
      tags: [Longitudinal Clinical Core]
      summary: Obtener un ClinicalDiff con operaciones y propuesta original
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {"200": {description: ClinicalDiff, content: {application/json: {schema: {$ref: "#/components/schemas/ClinicalDiff"}}}}}
  /api/v1/clinical-diffs/{id}/operations/{operation_id}/decision:
    put:
      tags: [Longitudinal Clinical Core]
      summary: Aprobar, modificar o rechazar una operación una sola vez
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters:
        - {name: id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: operation_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: "#/components/schemas/ClinicalDiffDecisionRequest"}}}}
      responses:
        "200": {description: Diff recalculado}
        "409": {description: Operación ya decidida o revisión desactualizada}
  /api/v1/clinical-diffs/{id}/merge:
    post:
      tags: [Longitudinal Clinical Core]
      summary: Fusionar atómicamente operaciones revisadas por una persona CA-W
      security: [{bearerAuth: [], tenantHeader: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody:
        required: true
        content: {application/json: {schema: {type: object, required: [expected_diff_revision], properties: {expected_diff_revision: {type: integer, minimum: 1}}}}}
      responses:
        "200": {description: Diff fusionado o respuesta idempotente}
        "409": {description: Diff no aprobado o estado base desactualizado}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    tenantHeader:
      type: apiKey
      in: header
      name: X-Tenant-ID

  parameters:
    PathClientID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathClinicalClientID:
      name: client_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathAppointmentID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathAppointmentIDAlt:
      name: appointment_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PathNoteID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QueryFrom:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date-time
    QueryTo:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date-time
    AuditActor:
      name: actor
      in: query
      schema:
        type: string
        format: uuid
    AuditAction:
      name: action
      in: query
      schema:
        type: string
    AuditActionPrefix:
      name: action_prefix
      in: query
      schema:
        type: string
    AuditEntity:
      name: entity
      in: query
      schema:
        type: string
    AuditFrom:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    AuditTo:
      name: to
      in: query
      schema:
        type: string
        format: date-time
    AuditCursor:
      name: cursor
      in: query
      schema:
        type: string
        format: date-time
    AuditCursorID:
      name: cursor_id
      in: query
      schema:
        type: string
        format: uuid
    AuditOrder:
      name: order
      in: query
      schema:
        type: string
        enum: [asc, desc]
    AuditLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    AuditOffset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0

  responses:
    ValidationError:
      description: Error de validacion
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: validation_error
              message: invalid request body
              details:
                field: body
    UnauthorizedError:
      description: No autorizado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: unauthorized
              message: invalid credentials or token
              details:
                field: Authorization
                reason: invalid_or_expired_token
    ForbiddenError:
      description: Prohibido
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: forbidden
              message: forbidden
    NotFoundError:
      description: No encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: not_found
              message: not found
    ConflictError:
      description: Conflicto
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: conflict
              message: appointment overlaps existing slot
    ServiceUnavailableError:
      description: Servicio no disponible
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: service_unavailable
              message: service unavailable
    TooManyRequestsError:
      description: Demasiadas solicitudes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: too_many_requests
              message: too many login attempts, try again later
              details:
                field: ip
                reason: limit_exceeded

  schemas:
    ClinicalEvidence:
      type: object
      required: [id, tenant_id, client_id, source_type, source_id, source_version, source_item_id, epistemic_type, statement, status, version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        source_type: {type: string, enum: [session_report]}
        source_id: {type: string, format: uuid}
        source_version: {type: integer, minimum: 1}
        source_item_id: {type: string}
        epistemic_type: {type: string, enum: [patient_report, therapist_observation, measurement, documented_fact, inference]}
        statement: {type: string}
        status: {type: string, enum: [active, superseded, invalidated]}
        version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ClinicalDiffOperation:
      type: object
      required: [id, sequence, operation_type, target_entity_id, original_proposal, review_status]
      properties:
        id: {type: string, format: uuid}
        sequence: {type: integer, minimum: 1}
        operation_type: {type: string, enum: [create_evidence, invalidate_evidence, create_event, approve_event, link_event_process, create_process, update_process, close_process, reopen_process, create_hypothesis, update_hypothesis, link_supporting_evidence, link_contradicting_evidence, strengthen_hypothesis, weaken_hypothesis, retire_hypothesis]}
        target_entity_id: {type: string, format: uuid}
        expected_entity_version: {type: integer, nullable: true}
        original_proposal: {type: object, additionalProperties: true}
